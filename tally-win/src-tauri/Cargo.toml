[package]
name = "tolly-windows"
version = "1.2.0"
description = "Tolly — local-first AI coding usage tray app for Windows"
authors = ["Tolly contributors"]
edition = "2021"
license = "MIT"
repository = "https://github.com/rui8001/tolly"
homepage = "https://github.com/rui8001/tolly"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"

[features]
default = []

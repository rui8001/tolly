name: Windows candidate verification
on:
  pull_request:
    paths:
      - '.github/workflows/windows-candidate.yml'
      - 'scripts/prepare-candidate.mjs'
      - 'scripts/candidate-binary-hashes.mjs'
      - 'scripts/test-windows-candidate.ps1'
      - 'tally-win/tests/candidate-version.test.mjs'
      - 'tally-win/tests/candidate-binary-hashes.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: tally-win/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate source before candidate stamping
        run: |
          node scripts/check-version.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Source version check failed' }
          node scripts/check-privacy.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Privacy check failed' }
          node --test tally-win/tests/candidate-version.test.mjs tally-win/tests/candidate-binary-hashes.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Candidate regression tests failed' }
      - name: Parse Windows verification script
        shell: pwsh
        run: |
          $parseErrors = $null
          $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path scripts/test-windows-candidate.ps1), [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
      - name: Stamp disposable build as candidate 1.2.1
        run: |
          node scripts/prepare-candidate.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Candidate version stamp failed' }
          node scripts/check-version.mjs --tag v1.2.1
          if ($LASTEXITCODE -ne 0) { throw 'Candidate version check failed' }
      - run: python -m unittest discover -s tests -v
        working-directory: tally-engine
      - run: python -m pip install -e ".\tally-engine[build]"
      - run: pnpm install --frozen-lockfile
        working-directory: tally-win
      - run: pnpm web:test
        working-directory: tally-win
      - run: pnpm build
        working-directory: tally-win
        env:
          TALLY_PYTHON: python
      - name: Package candidate provenance and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path candidate-assets | Out-Null
          $assets = @(Get-ChildItem tally-win/src-tauri/target/release/bundle -Recurse -File | Where-Object { $_.Extension -in '.msi','.exe' })
          if ($assets.Count -ne 2) { throw 'Expected MSI and NSIS installers' }
          $assets | Copy-Item -Destination candidate-assets
          $assets | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)" } | Set-Content candidate-assets/SHA256SUMS.txt -Encoding utf8NoBOM
          $hashJson = node scripts/candidate-binary-hashes.mjs tally-win/src-tauri/target/release/tolly-windows.exe
          if ($LASTEXITCODE -ne 0) { throw 'Candidate bundle hash calculation failed' }
          $binaryHashes = $hashJson | ConvertFrom-Json
          $manifest = @{
            version = '1.2.1'; baseline = 'v1.2.0'; candidate_only = $true
            source_sha = (git rev-parse HEAD); workflow_run = $env:GITHUB_RUN_ID
            app_sha256_unbundled = $binaryHashes.app_sha256_unbundled
            app_sha256_by_installer = $binaryHashes.app_sha256_by_installer
            sidecar_sha256 = (Get-FileHash tally-win/src-tauri/binaries/tally-engine-x86_64-pc-windows-msvc.exe -Algorithm SHA256).Hash
          }
          $manifest | ConvertTo-Json -Depth 4 | Set-Content candidate-assets/candidate.json -Encoding utf8NoBOM
          git diff -- tally-win/package.json tally-win/src-tauri/tauri.conf.json tally-win/src-tauri/Cargo.toml tally-win/src-tauri/Cargo.lock tally-engine/pyproject.toml tally-engine/engine/__init__.py | Set-Content candidate-assets/version-stamp.patch -Encoding utf8NoBOM
      - uses: actions/upload-artifact@v7
        with:
          archive: true
          name: windows-candidate-${{ github.run_id }}
          path: candidate-assets/
          if-no-files-found: error
          retention-days: 14
  verify:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        installer: [msi, nsis]
        scenario: [clean, upgrade]
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v6
        with:
          name: windows-candidate-${{ github.run_id }}
          path: candidate-assets
      - name: Verify installation, launch, upgrade data and uninstall
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/test-windows-candidate.ps1 -Kind '${{ matrix.installer }}' -Scenario '${{ matrix.scenario }}'
      - name: Retain synthetic installer logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          archive: true
          name: candidate-logs-${{ matrix.installer }}-${{ matrix.scenario }}
          path: |
            *-install.log
            candidate-uninstall.log
          if-no-files-found: ignore
          retention-days: 7

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: tally-win/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install -e ".\tally-engine[build]"
      - run: pnpm install --frozen-lockfile
        working-directory: tally-win
      - run: pnpm build
        working-directory: tally-win
      - name: Create GitHub release and upload installers
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" --generate-notes
          Get-ChildItem "tally-win/src-tauri/target/release/bundle" -Recurse -File |
            ForEach-Object { gh release upload "${{ github.ref_name }}" $_.FullName }

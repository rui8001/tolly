name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: tally-win/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify tag and source versions
        run: node scripts/check-version.mjs --tag "${{ github.ref_name }}"
      - name: Test engine
        run: python -m unittest discover -s tests -v
        working-directory: tally-engine
      - name: Check tracked data for private paths
        run: node scripts/check-privacy.mjs
      - run: python -m pip install -e ".\tally-engine[build]"
      - run: pnpm install --frozen-lockfile
        working-directory: tally-win
      - run: pnpm web:test
        working-directory: tally-win
      - run: pnpm build
        working-directory: tally-win
      - name: Create SHA-256 checksums
        shell: pwsh
        run: |
          $bundle = Resolve-Path "tally-win/src-tauri/target/release/bundle"
          $assets = Get-ChildItem $bundle -Recurse -File |
            Where-Object { $_.Extension -in ".exe", ".msi" } |
            Sort-Object Name
          if ($assets.Count -ne 2) {
            throw "Expected one NSIS installer and one MSI package, found $($assets.Count)."
          }
          $lines = $assets | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          Set-Content -LiteralPath (Join-Path $bundle "SHA256SUMS.txt") -Value $lines -Encoding utf8
      - name: Create GitHub release and upload installers
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $bundle = Resolve-Path "tally-win/src-tauri/target/release/bundle"
          $assets = @(
            Get-ChildItem $bundle -Recurse -File | Where-Object { $_.Extension -in ".exe", ".msi" }
            Get-Item (Join-Path $bundle "SHA256SUMS.txt")
          )
          gh release create "${{ github.ref_name }}" $assets.FullName --generate-notes --verify-tag

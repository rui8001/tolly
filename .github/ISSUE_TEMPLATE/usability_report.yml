name: Usability trial report
description: Report a privacy-safe Windows installation or usability trial.
title: "[Trial] "
labels: ["usability"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for testing Tolly. This Issue is public. Do not attach real logs, prompts, usernames, private paths, project names, account IDs, session IDs, API keys, cookies, or screenshots containing private data.

  - type: dropdown
    id: windows
    attributes:
      label: Windows version
      options:
        - Windows 11 x64
        - Windows 10 x64
        - Other or unknown
    validations:
      required: true

  - type: dropdown
    id: installer
    attributes:
      label: Installer
      options:
        - NSIS setup EXE
        - MSI
        - Source development build
    validations:
      required: true

  - type: dropdown
    id: outcome
    attributes:
      label: Outcome
      options:
        - Completed the suggested test
        - Stopped because of a problem
        - Could not install or launch
    validations:
      required: true

  - type: checkboxes
    id: stages
    attributes:
      label: Stages completed
      options:
        - label: Verified the installer checksum
        - label: Installed Tolly
        - label: Opened the tray panel
        - label: Viewed Overview, Models, Projects, and Settings
        - label: Checked second-launch or tray behavior
        - label: Uninstalled Tolly

  - type: textarea
    id: first_problem
    attributes:
      label: First reproducible problem
      description: Describe only the first problem, using synthetic or redacted details.
      placeholder: What happened, what did you expect, and what are the minimum safe steps to reproduce it?
    validations:
      required: false

  - type: textarea
    id: clarity
    attributes:
      label: What was unclear?
      description: Do not include private data or exact usage totals.
    validations:
      required: false

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I checked this report and removed logs, prompts, private paths, identities, account data, credentials, and sensitive screenshots.
          required: true

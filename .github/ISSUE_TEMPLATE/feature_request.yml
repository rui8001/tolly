name: 功能建议
description: 建议新功能、采集器或体验改进
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 请说明使用场景，而不只是给出实现方案。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: 数据与隐私影响
      description: 如果需要读取新目录、数据库或联网，请说明最小权限和关闭方式。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 可选方案
  - type: checkboxes
    id: attribution
    attributes:
      label: 归属确认
      options:
        - label: 建议不要求复制第三方品牌、图标、截图或未明确授权的代码。
          required: true
